<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><rect width="1100" height="740" fill="white"/><text x="40" y="40" font-family="sans-serif" font-size="24">Entitlement extension — 17 tables / 126 columns / 29 FKs overall</text><rect x="40" y="80" width="400" height="240" fill="#eef5fa" stroke="#235983"/><text x="52" y="110" font-family="sans-serif" font-size="18">Role</text><text x="52" y="138" font-family="sans-serif" font-size="18">PK RoleCode VARCHAR(16)</text><text x="52" y="166" font-family="sans-serif" font-size="18">Description VARCHAR(255) NOT NULL</text><text x="52" y="194" font-family="sans-serif" font-size="18">RoleClass VARCHAR(16) NOT NULL</text><text x="52" y="222" font-family="sans-serif" font-size="18">IsActive BOOLEAN NOT NULL</text><text x="52" y="250" font-family="sans-serif" font-size="18">RowVersion BIGINT UNSIGNED NOT NULL</text><text x="52" y="278" font-family="sans-serif" font-size="18">Immutable category; configurable grants</text><rect x="580" y="80" width="470" height="240" fill="#eef5fa" stroke="#235983"/><text x="592" y="110" font-family="sans-serif" font-size="18">Permission</text><text x="592" y="138" font-family="sans-serif" font-size="18">PK PermissionCode VARCHAR(40)</text><text x="592" y="166" font-family="sans-serif" font-size="18">BorrowerScope VARCHAR(16) NULL</text><text x="592" y="194" font-family="sans-serif" font-size="18">LenderScope VARCHAR(16) NULL</text><text x="592" y="222" font-family="sans-serif" font-size="18">AdministratorScope VARCHAR(16) NULL</text><text x="592" y="250" font-family="sans-serif" font-size="18">AuditorScope VARCHAR(16) NULL</text><text x="592" y="278" font-family="sans-serif" font-size="18">AllowRestricted BOOLEAN NOT NULL</text><rect x="320" y="440" width="500" height="160" fill="#eef5fa" stroke="#235983"/><text x="332" y="470" font-family="sans-serif" font-size="18">RolePermission</text><text x="332" y="498" font-family="sans-serif" font-size="18">PK/FK RoleCode VARCHAR(16)</text><text x="332" y="526" font-family="sans-serif" font-size="18">PK/FK PermissionCode VARCHAR(40)</text><text x="332" y="554" font-family="sans-serif" font-size="18">ScopeCode VARCHAR(16) NOT NULL</text><text x="332" y="582" font-family="sans-serif" font-size="18">PK (RoleCode, PermissionCode)</text><path d="M 240 320 L 440 440" stroke="#235983" fill="none"/><text x="40" y="360" font-family="sans-serif" font-size="14">Role: 0..N grants</text><text x="40" y="380" font-family="sans-serif" font-size="14">Each grant: 1 parent</text><path d="M 810 320 L 700 440" stroke="#235983" fill="none"/><text x="850" y="360" font-family="sans-serif" font-size="14">Permission: 0..N grants</text><text x="850" y="380" font-family="sans-serif" font-size="14">Each grant: 1 parent</text><text x="40" y="650" font-family="sans-serif" font-size="17">UserRole still maps users to roles. Existing 27 FKs remain unchanged.</text><text x="40" y="680" font-family="sans-serif" font-size="17">Scopes: SELF / OWN / PARTICIPATING / ALL. Business rules remain procedural.</text></svg>