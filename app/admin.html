<!doctype html><html lang="en"><meta charset="utf-8"><title>Entitlement administration</title><style>body{font:16px system-ui;margin:2rem}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.4rem}form{background:#eef3f8;padding:1rem;margin:1rem 0}input,select,button{padding:.5rem;margin:.3rem}</style>
<h1>Roles and permissions</h1>
<form id="loginForm"><h2>Sign in</h2><input name="login" autocomplete="username" required placeholder="Login"><input name="password" type="password" autocomplete="current-password" required placeholder="Password"><button>Sign in</button></form>
<button id="logout">Sign out</button><button id="monitor">Monitoring</button><pre id="metrics"></pre><p>Supported scopes enforce ownership, participation and privacy. Refresh the matrix after each change.</p>
<form id="role"><h2>Create/update role</h2><input name="code" placeholder="Role code" required maxlength="16"><select name="category"><option>Borrower</option><option>Lender</option><option>Administrator</option><option>Auditor</option></select><input name="description" placeholder="Description" required><label>Active<input name="active" type="checkbox" checked></label><input name="version" type="number" min="0" placeholder="Version; blank for new"><button>Save role</button></form>
<form id="permission"><h2>Grant/revoke permission</h2><input name="role" placeholder="Role" required><input name="permission" placeholder="Permission from matrix" required><select name="scope"><option value="">Revoke</option><option>SELF</option><option>OWN</option><option>PARTICIPATING</option><option>ALL</option></select><input name="version" type="number" min="0" placeholder="Current role version" required><button>Save permission</button></form>
<form id="membership"><h2>Grant/revoke membership</h2><input name="user" type="number" min="1" placeholder="User ID" required><input name="role" placeholder="Role" required><label>Grant<input name="grant" type="checkbox" checked></label><button>Save membership</button></form>
<p id="status" role="status"></p><button id="refresh">Refresh</button><table><thead id="head"></thead><tbody id="rows"></tbody></table>
<script>let csrf='';const status=document.getElementById('status');async function refresh(){const head=document.getElementById('head');const rows=document.getElementById('rows');const r=await fetch('/matrix');const d=await r.json();if(!r.ok){status.textContent=d.error;return;}head.replaceChildren();rows.replaceChildren();if(!d.length)return;const h=document.createElement('tr');for(const k of Object.keys(d[0])){const c=document.createElement('th');c.textContent=k;h.append(c);}head.append(h);for(const row of d){const t=document.createElement('tr');for(const v of Object.values(row)){const c=document.createElement('td');c.textContent=v??'—';t.append(c);}rows.append(t);}}
for(const f of [...document.forms].filter(f=>f.id!=='loginForm'))f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));for(const k of ['version','user'])if(k in d)d[k]=d[k]===''?null:Number(d[k]);for(const k of ['active','grant'])if(f.elements[k])d[k]=f.elements[k].checked;if('scope'in d&&d.scope==='')d.scope=null;try{const r=await fetch('/'+f.id,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(d)});const result=await r.json();status.textContent=r.ok?'Saved':result.error;await refresh();}catch{status.textContent='Connection failed';}};document.getElementById('refresh').onclick=refresh;
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=e.target;const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();f.elements.password.value='';if(r.ok){csrf=d.csrf;status.textContent='Signed in as user '+d.user_id;await refresh();}else status.textContent=d.error.code;};
document.getElementById('logout').onclick=async()=>{await fetch('/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}});csrf='';document.getElementById('head').replaceChildren();document.getElementById('rows').replaceChildren();status.textContent='Signed out';};
document.getElementById('monitor').onclick=async()=>{const r=await fetch('/monitoring');document.getElementById('metrics').textContent=JSON.stringify(await r.json(),null,2);};
fetch('/session').then(async r=>{if(r.ok){csrf=(await r.json()).csrf;await refresh();}});</script></html>
